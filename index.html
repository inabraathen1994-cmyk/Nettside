<!doctype html>
<!--
  INA HAUGANE BRAATHEN – PORTEFØLJE
  Hele nettsiden ligger i denne ene fila. Dobbeltklikk for å åpne den i nettleseren.

  TIL CLAUDE (når Ina laster opp fila for å endre noe):
  Fila er bygget opp i fem deler, i denne rekkefølgen:
   1. <style id="style">       Designet. Farger og skrifter er variabler øverst i :root
                                (--paper bakgrunn, --ink tekst, --pink blokker, --marker gule merkelapper),
                                med egne verdier for mørk modus rett under.
   2. <style id="motion">      Animasjonene. Alt slås av ved prefers-reduced-motion.
   3. <script id="site-data">  Alt innhold som JSON:
                                "cv"   = navn, tittel, e-post, portrett (data-URI) og CV
                                "site" = arbeider (works), lenker, om-tekst (intro), farger (theme), portrett (photo, overstyrer cv.photo)
   4. <script id="site-js">        Bygger siden ut fra site-data. Endres bare ved nye seksjoner eller ny layout.
   5. <script id="motion-js">  Kobler animasjonene på siden.
  Når siden ligger på GitHub Pages sammen med content/site.json (redigeres i Pages CMS),
  erstatter den fila "site"-delen. CV og design endres alltid her.
  Behold strukturen og id-ene, svar på norsk, og gi tilbake hele fila ferdig til å lastes opp.
-->
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ina Haugane Braathen – designer</title>
<meta name="description" content="Ina Haugane Braathen er designer i Oslo. Portefølje, CV og kontakt.">
<meta property="og:title" content="Ina Haugane Braathen – designer">
<meta property="og:description" content="Portefølje, CV og kontakt.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3c9da'/%3E%3Ctext x='4' y='25' font-family='Arial' font-weight='900' font-size='22'%3EI_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style id="style">
/* Layout: the CV as a page system - giant grotesk name, Courier typewriter body, pink square blocks behind headings, yellow highlighter chips, a hairline spine between columns. */
:root{
  --paper:#ffffff;
  --ink:#0f0d0e;
  --muted:#6d6468;
  --rule:#e8dfe3;
  --pink:#f3c9da;
  --pink-deep:#e79bbb;
  --marker:#f2f13d;
  --marker-ink:#0f0d0e;
  --tile:#faf3f6;
  --f-display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Courier Prime","Courier New",Courier,monospace;
}
:root{color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-mono);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink-deep);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.mark{font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:-.03em;text-decoration:none}
.mark span{animation:blink 1.1s steps(1) infinite}
.nav{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;font-size:14px}
.nav a{text-decoration:none;text-transform:uppercase;letter-spacing:.04em}
.nav a:hover{background:var(--pink)}
@media (max-width:620px){.nav{margin-left:0;width:100%;gap:14px;font-size:13px}}

/* chips (yellow highlighter, as on the CV) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--marker);color:var(--marker-ink);font-family:var(--f-mono);font-size:14px;padding:4px 9px;border:0;text-decoration:none;line-height:1.3;cursor:default}
a.chip,button.chip{cursor:pointer}
a.chip:hover,button.chip:hover{background:var(--ink);color:var(--paper)}
.chip b{font-weight:400;opacity:.65}
.chip.ghost{background:transparent;color:var(--ink);outline:1px dashed var(--muted)}

/* hero */
.hero{padding-block:clamp(40px,7vw,96px) clamp(32px,5vw,64px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.portrait{background:var(--pink);aspect-ratio:1/1;width:100%;max-width:100%;position:relative;overflow:hidden}
.portrait img{position:absolute;left:0;top:0;width:60%;height:auto;transform-origin:30% 30%}
.name{font-family:var(--f-display);font-weight:900;font-stretch:88%;font-size:clamp(2.7rem,9.2vw,8.4rem);line-height:.86;letter-spacing:-.045em;margin:0;text-transform:uppercase;text-wrap:balance}
.name .cur{display:inline;animation:blink 1.1s steps(1) infinite;font-size:clamp(2.6rem,10vw,8rem);font-stretch:85%;letter-spacing:-.05em;line-height:0}
@keyframes blink{50%{opacity:0}}
.role{margin:28px 0 18px;font-size:clamp(15px,1.6vw,18px);max-width:58ch}
.role strong{font-weight:700;text-transform:uppercase}
@media (max-width:620px){.hero-grid{grid-template-columns:1fr}.portrait{width:150px}}

/* section heads with the pink block behind */
.sec{padding-block:clamp(48px,7vw,88px);border-top:1px solid var(--rule)}
.h{font-family:var(--f-display);font-weight:900;font-stretch:80%;text-transform:uppercase;letter-spacing:-.06em;font-size:clamp(1.9rem,4.6vw,3.4rem);line-height:1;margin:0 0 32px;position:relative;display:inline-block;padding-left:.15em}
.h::before{content:"";position:absolute;left:.55em;top:-.32em;width:1.05em;height:1.05em;background:var(--pink);z-index:-1}
.h{z-index:0;isolation:isolate}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 28px}
.filters button{font:inherit;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--ink);padding:4px 10px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* works grid */
.works{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(16px,2.4vw,32px)}
.work{grid-column:span 4;min-width:0;position:relative}
.work.big{grid-column:span 8}
.work.mid{grid-column:span 6}
@media (max-width:900px){.work,.work.big,.work.mid{grid-column:span 6}}
@media (max-width:560px){.work,.work.big,.work.mid{grid-column:span 12}}
.work button.open{all:unset;display:block;width:100%;cursor:zoom-in}
.work button.open:focus-visible{outline:2px solid var(--pink-deep);outline-offset:3px}
.media{background:var(--tile);aspect-ratio:4/5;overflow:hidden;position:relative}
.work.big .media{aspect-ratio:16/11}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.work:hover .media img,.work:hover .media video{transform:scale(1.025)}
.pdf-tile{position:absolute;inset:0;display:grid;place-items:center;background:var(--pink);font-family:var(--f-display);font-weight:900;font-size:clamp(3rem,8vw,6rem);letter-spacing:-.06em}
.count{position:absolute;right:10px;bottom:10px;background:var(--marker);color:var(--marker-ink);font-size:12px;padding:2px 6px}
.cap{display:flex;justify-content:space-between;gap:12px;margin-top:10px;align-items:baseline}
.cap h3{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;margin:0;text-transform:uppercase;line-height:1.1;min-width:0}
.cap span{font-size:13px;color:var(--muted);white-space:nowrap}

.empty{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,32px)}
.empty .ph{aspect-ratio:4/5;background:var(--tile);position:relative}
.empty .ph:nth-child(2){background:var(--pink)}
.empty .ph span{position:absolute;left:12px;bottom:12px;font-size:13px;color:var(--muted)}
.empty-note{grid-column:1/-1;max-width:60ch;font-size:15px}
@media (max-width:560px){.empty{grid-template-columns:1fr 1fr}.empty .ph:nth-child(3){display:none}}

/* edit toolbar on cards */
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tools button,.btn{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:3px 9px;cursor:pointer}
.tools button:hover,.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--pink-deep);color:var(--ink);border-color:var(--pink-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tools .danger{border-color:#b3261e;color:#b3261e}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(24px,5vw,72px)}
.lede{font-family:var(--f-display);font-weight:500;font-stretch:95%;font-size:clamp(1.35rem,2.6vw,2.05rem);line-height:1.18;letter-spacing:-.02em;margin:0;max-width:30ch;text-wrap:pretty;white-space:pre-line}
@media (max-width:760px){.about{grid-template-columns:1fr}}

/* cv */
.cv{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,2.2fr);gap:clamp(20px,4vw,48px)}
.spine{background:var(--rule)}
.side{text-align:right;display:flex;flex-direction:column;gap:36px}
.side .h{font-size:clamp(1.3rem,2.4vw,1.7rem);margin-bottom:14px}
.side ul{list-style:none;margin:0;padding:0;font-size:15px;line-height:1.45}
.main{display:flex;flex-direction:column;gap:48px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 40px}
.entry{font-size:15px;line-height:1.45}
.entry .k{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.entry .t{display:block;font-weight:700;text-transform:uppercase}
.entry .y{display:inline-block;margin-top:2px;background:var(--marker);color:var(--marker-ink);font-size:13px;padding:0 5px}
.note{font-size:14px;color:var(--muted);max-width:60ch;margin:0}
@media (max-width:760px){.cv{grid-template-columns:1fr}.spine{display:none}.side{text-align:left;order:2;flex-direction:row;flex-wrap:wrap;gap:32px 48px}.cols{grid-template-columns:1fr}}

/* contact */
.contact{padding-block:clamp(56px,9vw,120px);border-top:1px solid var(--rule)}
.big-cta{font-family:var(--f-display);font-weight:900;font-stretch:85%;text-transform:uppercase;letter-spacing:-.05em;line-height:.88;font-size:clamp(2.6rem,10vw,8rem);margin:0 0 28px}
.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.mail a{text-decoration:none;font-family:var(--f-mono);font-size:clamp(17px,2.4vw,24px);user-select:all;word-break:break-all}
.foot{border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px}

/* lightbox */
dialog.lb{border:0;padding:0;max-width:min(1100px,100vw - 24px);width:100%;max-height:calc(100vh - 24px);background:var(--paper);color:var(--ink)}
dialog.lb::backdrop{background:rgba(15,13,14,.72)}
.lb-in{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);max-height:calc(100vh - 24px)}
.lb-media{overflow:auto;background:var(--tile);display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 24px)}
.lb-media img,.lb-media video{width:100%;height:auto;display:block}
.lb-media .pdf-link{padding:40px 20px;background:var(--pink);text-align:center}
.lb-text{padding:28px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.lb-text h3{font-family:var(--f-display);font-weight:900;font-stretch:85%;text-transform:uppercase;letter-spacing:-.04em;font-size:clamp(1.6rem,3vw,2.4rem);line-height:.95;margin:0}
.lb-text p{margin:0;white-space:pre-line;font-size:15px}
.lb-close{position:absolute;top:10px;right:10px;z-index:2}
@media (max-width:760px){.lb-in{grid-template-columns:1fr;overflow:auto}.lb-media{max-height:none}}
</style>
<style id="motion">
/* Motion: highlighter sweeps, pink blocks that pop in, wipes on the work images, a skills ticker,
   a cursor label over the works. Everything is switched off for people who ask for reduced motion. */

/* skills ticker (always shown; it only moves when motion is allowed) */
.marquee{background:var(--pink);border-block:1px solid var(--ink);overflow:hidden;user-select:none}
.mq-track{display:flex;width:max-content}
.mq-track span{font-family:var(--f-display);font-weight:900;font-stretch:85%;text-transform:uppercase;letter-spacing:-.04em;font-size:clamp(1.3rem,3vw,2.3rem);line-height:1;padding:14px 0;white-space:nowrap}
.mq-track i{font-style:normal;padding:0 .45em}
.mo .mq-track{animation:mq 38s linear infinite}
.mo .marquee:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}

/* scroll progress line under the header */
.mo .bar::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--pink-deep);transform-origin:0 50%;transform:scaleX(var(--p,0))}

/* hero name: lines slide up out of a mask */
.name .ln{display:block;overflow:hidden;padding-top:.05em;margin-top:-.05em;padding-bottom:.2em;margin-bottom:-.2em}
.name .ln-i{display:block}
.mo .name.rv .ln-i{transform:translateY(105%);transition:transform 1s cubic-bezier(.2,.8,.1,1) var(--d,0ms)}
.mo .name.rv.in .ln-i{transform:none}

/* generic reveal */
.mo .rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease var(--d,0ms),transform .9s cubic-bezier(.2,.8,.1,1) var(--d,0ms)}
.mo .rv.in{opacity:1;transform:none}
.mo .name.rv{opacity:1;transform:none}

/* yellow chips: drawn on like a highlighter */
.mo .chip.rv{opacity:1;transform:none;background-color:transparent;background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-size:0% 100%;transition:background-size .6s cubic-bezier(.6,0,.2,1) var(--d,0ms)}
.mo .chip.rv.in{background-size:100% 100%}
.mo a.chip.rv:hover{background-image:none;background-color:var(--ink)}

/* headings: the pink square pops in behind */
.mo .h.rv::before{transform:scale(0) rotate(-12deg);transform-origin:20% 80%;transition:transform .7s cubic-bezier(.3,1.6,.5,1) calc(var(--d,0ms) + .2s)}
.mo .h.rv.in::before{transform:none}

/* work cards: image wipes up, then the caption */
.mo .work.rv{opacity:1;transform:none}
.mo .work.rv .media{clip-path:inset(100% 0 0 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1) var(--d,0ms),box-shadow .35s ease,transform .35s ease}
.mo .work.rv.in .media{clip-path:inset(0 0 0 0)}
.mo .work.rv .cap{opacity:0;transform:translateY(10px);transition:opacity .6s ease calc(var(--d,0ms) + .45s),transform .6s ease calc(var(--d,0ms) + .45s)}
.mo .work.rv.in .cap{opacity:1;transform:none}
.mo .work.rv.done .media{clip-path:none}

/* hover: card lifts off a pink block */
.work .media{transition:box-shadow .35s ease,transform .35s ease}
.work:hover .media{transform:translate(-6px,-6px);box-shadow:10px 10px 0 var(--pink)}

/* cursor label over the works (mouse only) */
.cursor-tag{position:fixed;left:0;top:0;z-index:40;pointer-events:none;background:var(--marker);color:var(--marker-ink);font-family:var(--f-mono);font-size:13px;padding:5px 10px;white-space:nowrap;transform:translate(-50%,-50%) scale(0);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.cursor-tag.on{transform:translate(-50%,-50%) scale(1)}
.has-cursor .work button.open{cursor:none}

/* portrait follows the mouse a little */
.portrait img{transition:transform .5s cubic-bezier(.2,.8,.2,1);transform:translate(calc(var(--mx,0)*26px),calc(var(--my,0)*18px)) rotate(calc(var(--mx,0)*9deg))}

/* touch screens have no mouse: the head wobbles a little on its own */
@media (hover:none){.mo .portrait img{animation:wobble 2.6s ease-in-out infinite}}
@keyframes wobble{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(9px,4px) rotate(6deg)}45%{transform:translate(-4px,9px) rotate(-4deg)}70%{transform:translate(-9px,-2px) rotate(-7deg)}85%{transform:translate(3px,-3px) rotate(3deg)}}

/* "Si hei_": letters hop on hover */
.big-cta .l{display:inline-block;white-space:pre}
.mo .big-cta:hover .l{animation:hop .55s cubic-bezier(.3,1.6,.5,1) calc(var(--i)*35ms)}
@keyframes hop{40%{transform:translateY(-.14em) rotate(-3deg)}}

@media (prefers-reduced-motion:reduce){
  .portrait img{transform:none}
  .work:hover .media{transform:none}
}
@media print{.mo .rv,.mo .rv .cap{opacity:1!important;transform:none!important}.mo .rv .media{clip-path:none!important}.mo .name .ln-i{transform:none!important}}

.big-cta .cur{display:inline-block;animation:blink 1.1s steps(1) infinite}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="site-data">
{
 "cv": {
  "name": "Ina Haugane Braathen",
  "nameLines": [
   "Ina Haugane",
   "Braathen"
  ],
  "title": "Designer",

<script id="motion-js">
/* Motion for the portfolio. Works on top of whatever app.js renders into #app,

(function(){
"use strict";
var root = document.documentElement;
var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var finePointer = window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches;

function splitName(app){

  Array.prototype.slice.call(name.childNodes).forEach(function(n){ if (n.nodeName === "BR") parts.push([]); else parts[parts.length - 1].push(n); });

    var o = document.createElement("span"); o.className = "ln";
    var inner = document.createElement("span"); inner.className = "ln-i"; inner.style.setProperty("--d", (120 + i * 130) + "ms");
    p.forEach(function(n){ inner.append(n); });

function marquee(app){
  var hero = app.querySelector(".hero");
  if (!hero || app.querySelector(".marquee")) return;
  var skills = Array.prototype.slice.call(app.querySelectorAll(".side ul")[0] ? app.querySelectorAll(".side ul")[0].children : []).map(function(li){ return li.textContent; });

    track.append(s);
  }

}

function splitCta(app){
  var cta = app.querySelector(".big-cta");
  if (!cta || cta.dataset.split) return;
  cta.dataset.split = "1";
  var first = cta.firstChild;

  app.querySelectorAll(".hero .role").forEach(function(el){ el.style.setProperty("--d", "450ms"); });
  stagger(Array.prototype.slice.call(app.querySelectorAll(".hero .chips .chip")), 110, 6);
  app.querySelectorAll(".hero .chips .chip").forEach(function(el, i){ el.style.setProperty("--d", (650 + i * 110) + "ms"); });
  app.querySelectorAll(".h").forEach(function(el){ reveal(el, 0); });
  var works = Array.prototype.slice.call(app.querySelectorAll(".work"));
  works.forEach(function(el, i){
    if (!el.classList.contains("rv")){
      /* once the wipe has finished, drop the clip so the pink hover block can show */

    }

}
